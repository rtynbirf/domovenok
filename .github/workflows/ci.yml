name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Минимальные права: workflow-токен умеет только читать код (least privilege).
permissions:
  contents: read

jobs:
  quality:
    name: Линт, типы, тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - name: Забрать код
        # Пин по хешу коммита (v7.0.1): тег можно подменить, хеш — нет.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Bun
        # Пин по хешу коммита (v2.2.0): защита supply chain.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14 # тот же, что локально и в lockfile — сборка воспроизводима

      - name: Установить зависимости
        run: bun install --frozen-lockfile

      - name: Сгенерировать Prisma Client
        run: bunx prisma generate

      - name: Линт
        run: bun run lint

      - name: Проверка типов
        run: bun run typecheck

      - name: Юнит-тесты
        run: bun run test

      - name: Подготовить базу для сборки
        run: bunx prisma db push --accept-data-loss --skip-generate

      - name: Сборка
        run: bun run build
