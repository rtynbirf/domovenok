# Еженедельный дозор зависимостей: свежие версии и патчи безопасности — сами.
version: 2
updates:
  - package-ecosystem:
    open-pull-requests-limit: 0  # версионный шум выключен (чистка 2026-11-18) "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem:
    open-pull-requests-limit: 0  # версионный шум выключен (чистка 2026-11-18) "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
